<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>illuminati Vault</title>
    <style>
        :root {
            --bg-deep: #070d1b;
            --bg-card: #0f1c3f;
            --bg-input: #172a5c;
            --accent-blue: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); }
        body { background: var(--bg-deep); color: var(--text-main); height: 100vh; height: 100dvh; display: flex; justify-content: center; align-items: center; overflow: hidden; }

        .app-container { width: 100%; max-width: 480px; height: 100%; height: 100dvh; background: var(--bg-deep); display: flex; flex-direction: column; position: relative; }
        @media (min-width: 500px) { .app-container { height: 90vh; border-radius: 16px; border: 1px solid #1e293b; box-shadow: 0 10px 30px rgba(0,0,0,0.8); } }

        /* Screens */
        .screen { display: none; flex: 1; flex-direction: column; padding: 24px; overflow-y: auto; }
        .screen.active { display: flex; }

        /* Login Screen */
        .login-wrapper { justify-content: center; align-items: center; text-align: center; gap: 20px; }
        .logo-icon { width: 70px; height: 70px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 32px; box-shadow: 0 0 20px var(--accent-glow); margin-bottom: 10px; }
        .input-group { width: 100%; text-align: left; margin-bottom: 14px; }
        .input-group label { font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 6px; }
        input, select { width: 100%; background: var(--bg-input); border: 1px solid #2563eb33; border-radius: 10px; padding: 14px; color: var(--text-main); font-size: 16px; outline: none; transition: border 0.2s; }
        input:focus, select:focus { border-color: var(--accent-blue); box-shadow: 0 0 10px var(--accent-glow); }
        
        .btn { width: 100%; background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; border: none; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: opacity 0.2s, transform 0.1s; margin-top: 10px; }
        .btn:active { transform: scale(0.98); }
        .btn-secondary { background: #1e293b; border: 1px solid #334155; color: var(--text-muted); }

        /* Dashboard Screen */
        .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .user-badge { font-size: 14px; background: #1e293b; padding: 6px 12px; border-radius: 20px; color: var(--text-muted); border: 1px solid #334155; }
        
        .balance-card { background: linear-gradient(145deg, #0f1c3f, #13265c); border: 1px solid #2563eb44; border-radius: 20px; padding: 24px; text-align: center; margin-bottom: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.4); position: relative; overflow: hidden; }
        .balance-label { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .balance-amount { font-size: 32px; font-weight: 800; color: #ffffff; margin-bottom: 12px; }
        .live-ticker { display: inline-flex; align-items: center; gap: 6px; background: rgba(16, 185, 129, 0.15); color: var(--success); padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; border: 1px solid rgba(16, 185, 129, 0.3); }
        .pulsing-dot { width: 7px; height: 7px; background: var(--success); border-radius: 50%; animation: pulse 1.5s infinite; }

        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }

        .actions-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 20px; }
        .action-tile { background: var(--bg-card); border: 1px solid #1e293b; border-radius: 14px; padding: 18px; text-align: center; cursor: pointer; transition: border 0.2s; }
        .action-tile:hover { border-color: var(--accent-blue); }
        .action-tile span { display: block; font-size: 24px; margin-bottom: 6px; }
        .action-tile p { font-size: 15px; font-weight: bold; }

        .info-card { background: var(--bg-card); border-radius: 14px; padding: 16px; border: 1px solid #1e293b; margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
        .info-label { font-size: 13px; color: var(--text-muted); }
        .info-val { font-weight: bold; color: var(--accent-blue); font-size: 14px; }

        /* Modal Overlay */
        .modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(7, 13, 27, 0.85); backdrop-filter: blur(5px); z-index: 100; justify-content: center; align-items: flex-end; }
        .modal.active { display: flex; }
        .modal-content { width: 100%; max-width: 480px; background: var(--bg-card); border-top: 1px solid #2563eb44; border-radius: 20px 20px 0 0; padding: 24px; animation: slideUp 0.3s ease-out; max-height: 85vh; overflow-y: auto; }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; }
        
        .error-text { color: var(--danger); font-size: 12px; margin-top: 6px; display: none; }
        .success-banner { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); color: var(--success); padding: 14px; border-radius: 10px; text-align: center; margin-bottom: 15px; display: none; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="screen active login-wrapper">
        <div class="logo-icon">⚡</div>
        <h2 style="font-size: 22px; margin-bottom: 4px;">Mining Vault Gateway</h2>
        <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 24px;">Enter your credentials to access system</p>
        
        <div class="input-group">
            <label>Login ID</label>
            <input type="text" id="loginIdInput" placeholder="Enter ID">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="loginPassInput" placeholder="Enter password">
        </div>
        <p id="loginError" class="error-text" style="display:block; margin-bottom:10px;"></p>
        <button class="btn" onclick="handleLogin()">Login</button>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="dashScreen" class="screen">
        <div class="dash-header">
            <div>
                <h3 style="font-size: 18px;">Vault Dashboard</h3>
                <p style="font-size: 12px; color: var(--text-muted);">Active Node: #NG-8894</p>
            </div>
            <div style="display:flex; gap:8px; align-items:center;">
                <div class="user-badge">ID: Dumi</div>
                <button onclick="handleLogout()" style="background:#1e293b; border:1px solid #334155; color:#94a3b8; padding:6px 10px; border-radius:12px; cursor:pointer; font-size:12px;">Logout</button>
            </div>
        </div>

        <div class="balance-card">
            <div class="balance-label">Accumulated Balance</div>
            <div class="balance-amount" id="balanceDisplay">₦12,900,000.00</div>
            <div class="live-ticker">
                <div class="pulsing-dot"></div>
                <span>+₦2.73 / sec mining rate</span>
            </div>
        </div>

        <div class="actions-grid">
            <div class="action-tile" onclick="openWithdrawModal()">
                <span>📤</span>
                <p>Withdraw Funds</p>
            </div>
        </div>

        <div class="info-card">
            <span class="info-label">📅 Next Meeting:</span>
            <span class="info-val">April 5th</span>
        </div>
    </div>

    <!-- WITHDRAWAL MODAL -->
    <div id="withdrawModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="font-size: 18px;">Withdraw Funds</h3>
                <button class="close-btn" onclick="closeWithdrawModal()">×</button>
            </div>

            <div id="withdrawSuccessBox" class="success-banner">Withdrawal processed successfully! Transfer underway.</div>

            <div class="input-group">
                <label>Select Bank</label>
                <select id="bankSelect">
                    <option value="">-- Choose Nigerian Bank --</option>
                    <option value="access">Access Bank</option>
                    <option value="citibank">Citibank Nigeria</option>
                    <option value="ecobank">Ecobank Nigeria</option>
                    <option value="fidelity">Fidelity Bank</option>
                    <option value="first">First Bank of Nigeria</option>
                    <option value="fcmb">First City Monument Bank (FCMB)</option>
                    <option value="gtb">Guaranty Trust Bank (GTB)</option>
                    <option value="heritage">Heritage Bank</option>
                    <option value="keystone">Keystone Bank</option>
                    <option value="polaris">Polaris Bank</option>
                    <option value="providus">Providus Bank</option>
                    <option value="stanbic">Stanbic IBTC Bank</option>
                    <option value="standard">Standard Chartered Bank</option>
                    <option value="sterling">Sterling Bank</option>
                    <option value="suntrust">SunTrust Bank</option>
                    <option value="union">Union Bank of Nigeria</option>
                    <option value="uba">United Bank for Africa (UBA)</option>
                    <option value="unity">Unity Bank</option>
                    <option value="wema">Wema Bank</option>
                    <option value="zenith">Zenith Bank</option>
                    <option value="opay">OPay Digital Services</option>
                    <option value="moniepoint">Moniepoint MFB</option>
                    <option value="kuda">Kuda Bank</option>
                    <option value="palmpay">PalmPay</option>
                    <option value="sparkle">Sparkle Microfinance Bank</option>
                    <option value="taj">TAJ Bank</option>
                    <option value="lotus">Lotus Bank</option>
                    <option value="finbank">Coronation Merchant Bank</option>
                </select>
            </div>

            <div class="input-group">
                <label>Account Number (10 Digits)</label>
                <input type="text" id="accountNumberInput" maxlength="10" placeholder="Enter 10-digit account number" inputmode="numeric">
            </div>

            <div class="input-group">
                <label>Account Holder Name</label>
                <input type="text" id="accountNameInput" placeholder="Enter your full name">
            </div>

            <div class="input-group">
                <label>Withdrawal Amount (₦)</label>
                <input type="text" id="withdrawAmountInput" placeholder="Enter amount to withdraw" inputmode="numeric">
            </div>

            <div class="input-group" id="membershipGroup" style="display: none;">
                <label>Membership Registration ID</label>
                <input type="text" id="membershipIdInput" placeholder="Enter required Member ID (e.g. @45374628927)">
            </div>

            <p id="withdrawError" class="error-text" style="margin-bottom: 10px;"></p>

            <button class="btn" id="withdrawActionBtn" onclick="handleWithdrawStep()">Proceed to Withdraw</button>
        </div>
    </div>

</div>

<script>
    // Persistent Background Accumulation Configuration
    const BASE_BALANCE = 12900000.00;
    const INCREMENT_PER_SEC = 2.73;
    const STORAGE_KEY_BALANCE = "vault_current_balance_v2";
    const STORAGE_KEY_TIMESTAMP = "vault_last_active_time_v2";

    let currentBalance = BASE_BALANCE;
    let tickerInterval = null;
    let withdrawalStage = 1; // Stage 1: Collect Details, Stage 2: Verify Membership ID

    function getStoredBalance() {
        const savedBalance = localStorage.getItem(STORAGE_KEY_BALANCE);
        const savedTime = localStorage.getItem(STORAGE_KEY_TIMESTAMP);
        
        if (savedBalance && savedTime) {
            const now = Date.now();
            const elapsedSeconds = (now - parseInt(savedTime)) / 1000;
            if (elapsedSeconds > 0) {
                return parseFloat(savedBalance) + (elapsedSeconds * INCREMENT_PER_SEC);
            }
        }
        return BASE_BALANCE;
    }

    function saveVaultState() {
        localStorage.setItem(STORAGE_KEY_BALANCE, currentBalance);
        localStorage.setItem(STORAGE_KEY_TIMESTAMP, Date.now());
    }

    function handleLogin() {
        const id = document.getElementById('loginIdInput').value.trim();
        const pass = document.getElementById('loginPassInput').value.trim();
        const err = document.getElementById('loginError');

        if(id === 'ilumi' && pass === '591666') {
            document.getElementById('loginScreen').classList.remove('active');
            document.getElementById('dashScreen').classList.add('active');
            
            currentBalance = getStoredBalance();
            startTicker();
        } else {
            err.innerText = "Invalid Login ID or Password.";
        }
    }

    function handleLogout() {
        saveVaultState();
        if(tickerInterval) clearInterval(tickerInterval);
        document.getElementById('dashScreen').classList.remove('active');
        document.getElementById('loginScreen').classList.add('active');
        document.getElementById('loginIdInput').value = '';
        document.getElementById('loginPassInput').value = '';
    }

    function startTicker() {
        if(tickerInterval) clearInterval(tickerInterval);
        tickerInterval = setInterval(() => {
            currentBalance += INCREMENT_PER_SEC;
            document.getElementById('balanceDisplay').innerText = '₦' + currentBalance.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            saveVaultState();
        }, 1000);
    }

    function openWithdrawModal() {
        document.getElementById('withdrawModal').classList.add('active');
        document.getElementById('withdrawSuccessBox').style.display = 'none';
        document.getElementById('withdrawError').style.display = 'none';
        document.getElementById('membershipGroup').style.display = 'none';
        document.getElementById('withdrawActionBtn').innerText = "Proceed to Withdraw";
        withdrawalStage = 1;
    }

    function closeWithdrawModal() {
        document.getElementById('withdrawModal').classList.remove('active');
    }

    function handleWithdrawStep() {
        const bank = document.getElementById('bankSelect').value;
        const accNum = document.getElementById('accountNumberInput').value.trim();
        const accName = document.getElementById('accountNameInput').value.trim();
        const amount = parseFloat(document.getElementById('withdrawAmountInput').value);
        const errBox = document.getElementById('withdrawError');
        const successBox = document.getElementById('withdrawSuccessBox');

        errBox.style.display = 'none';

        if(withdrawalStage === 1) {
            // Stage 1 validation
            if(!bank || accNum.length !== 10 || !accName) {
                errBox.innerText = "Please select a bank, provide a valid 10-digit account number, and enter your account name.";
                errBox.style.display = 'block';
                return;
            }

            if(!amount || isNaN(amount) || amount <= 0 || amount > currentBalance) {
                errBox.innerText = "Invalid withdrawal amount or insufficient funds.";
                errBox.style.display = 'block';
                return;
            }

            // Transition directly to Membership ID requirement prompt
            withdrawalStage = 2;
            document.getElementById('membershipGroup').style.display = 'block';
            document.getElementById('withdrawActionBtn').innerText = "Authorize Withdrawal";
            errBox.style.display = 'none';
        } 
        else if(withdrawalStage === 2) {
            // Stage 2: Membership ID Verification check
            const memberId = document.getElementById('membershipIdInput').value.trim();

            if(memberId !== '@45374628927') {
                errBox.innerText = "Invalid Membership Registration ID. Authorization denied.";
                errBox.style.display = 'block';
                return;
            }

            // Finalizing successful withdrawal execution
            currentBalance -= amount;
            saveVaultState();
            successBox.style.display = 'block';
            
            setTimeout(() => {
                closeWithdrawModal();
            }, 3000);
        }
    }
</script>

</body>
</html>
